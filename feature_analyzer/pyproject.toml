[project]
name = "feature-analyzer"
version = "0.1.0"
description = "Local web app + CLI for pattern analysis of possibly AI-generated audio (reuses wmg_train / wmg_features)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  # wmg_train, wmg_features, torch, numpy, pandas, matplotlib, soundfile come from training/.venv-arm64
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
