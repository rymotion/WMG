[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wmg_train"
version = "0.1.0"
description = "Dataset checks and student-model training for the WMG AI-vs-human music detector."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "pyloudnorm>=0.1.1",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "pytest>=8.0",
]

[project.optional-dependencies]
# ONNX export + parity check (tests skip them if absent).
export = ["onnx>=1.16", "onnxruntime>=1.17"]

[project.scripts]
wmg-check = "wmg_train.cli:main"

[tool.setuptools.packages.find]
include = ["wmg_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
