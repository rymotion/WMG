name: wmg_detector
description: On-device AI-generated-music detector (Rust features + Core ML) for iOS and macOS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: WmgDetectorPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: WmgDetectorPlugin
        sharedDarwinSource: true
