[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "wmg-features"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
description = "Detector feature extraction (Rust) for WMG training."

[tool.maturin]
features = ["python"]
module-name = "wmg_features"
